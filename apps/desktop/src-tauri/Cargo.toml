[package]
name = "phoneshare-desktop"
version = "1.0.0"
description = "PhoneShare masaustu kabugu (Tauri + Python sidecar)"
authors = ["Umut Celik (palamut62) <umutins62@hotmail.com>"]
repository = "https://github.com/palamut62"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "phoneshare_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
