[project]
name = "phoneshare-receiver"
version = "1.0.0"
description = "PhoneShare Windows Receiver — tek backend (FastAPI + SQLite)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Umut Celik", email = "umutins62@hotmail.com" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "aiofiles>=24.1",
    "zeroconf>=0.136",
    "websockets>=13.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=11.0"]
windows = ["pywin32>=308", "keyring>=25.5"]
# MVP DISI (PRD §76-78) — OCR tamamen opsiyoneldir; kurulu degilse ozellik kendini kapatir.
ocr = ["pytesseract>=0.3.13", "pillow>=11.0", "pypdf>=5.1", "pdf2image>=1.17"]
# MVP DISI — Windows masaustu bildirimi (toast).
toast = ["win10toast>=0.9"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "cryptography>=43.0",
]

[project.urls]
Homepage = "https://github.com/palamut62"
Author = "https://x.com/palamut62"

[project.scripts]
phoneshare-receiver = "phoneshare_receiver.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phoneshare_receiver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]
